openapi: 3.1.0
info:
  title: Real-Time Collaborative Task Board API
  version: 1.0.0
  description: |
    REST contract the frontend already codes against (see frontend/src/lib/api.ts and
    frontend/src/lib/types.ts). Real-time events are delivered over Socket.IO and are
    described in docs/API.md (WebSocket events) — OpenAPI cannot model them.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:4000/api
    description: Local development
security:
  - bearerJwt: []
tags:
  - name: Auth
  - name: Workspaces
  - name: Boards
  - name: Cards
  - name: Notifications

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account and sign in
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Created. Sets the refresh-token cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '409':
          description: Email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in. Sets the refresh-token cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange the refresh cookie for a new access token (rotates the cookie)
      operationId: refresh
      security: [{ refreshCookie: [] }]
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                type: object
                required: [accessToken]
                properties:
                  accessToken: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /workspaces:
    get:
      tags: [Workspaces]
      summary: Workspaces the caller belongs to
      operationId: listWorkspaces
      responses:
        '200':
          description: Workspaces, each with the caller's role
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /workspaces/{id}/members:
    get:
      tags: [Workspaces]
      summary: Members of a workspace
      operationId: listMembers
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkspaceMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /workspaces/{id}/boards:
    get:
      tags: [Workspaces]
      summary: Boards in a workspace
      operationId: listBoards
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Boards
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Board' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /boards/{id}:
    get:
      tags: [Boards]
      summary: Board snapshot (board, columns, cards with comments)
      operationId: getBoard
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /boards/{id}/columns:
    post:
      tags: [Boards]
      summary: Add a column
      operationId: createColumn
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Column' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /columns/{id}/cards:
    post:
      tags: [Cards]
      summary: Create a card (broadcasts card:created)
      operationId: createCard
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [boardId, title]
              properties:
                boardId: { type: string }
                title: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '201':
          description: Created (version 1)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /cards/{id}:
    patch:
      tags: [Cards]
      summary: Update card fields (optimistic concurrency)
      description: |
        Applies the patch only if `version` equals the card's current version, then increments it.
        A mismatch returns 409 and writes nothing.
      operationId: updateCard
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCardRequest' }
      responses:
        '200':
          description: Updated card (broadcasts card:updated)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Version conflict — the card changed since the client last saw it
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string, const: version_conflict }
    delete:
      tags: [Cards]
      summary: Delete a card (owner or admin only; broadcasts card:deleted)
      operationId: deleteCard
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cards/{id}/move:
    patch:
      tags: [Cards]
      summary: Move a card (last-write-wins; broadcasts card:moved)
      operationId: moveCard
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [columnId, order]
              properties:
                columnId: { type: string }
                order: { type: number }
      responses:
        '204': { description: Moved }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cards/{id}/comments:
    post:
      tags: [Cards]
      summary: Comment on a card (broadcasts comment:created; notifies the assignee)
      operationId: createComment
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications:
    get:
      tags: [Notifications]
      summary: The caller's notifications, newest first
      operationId: listNotifications
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AppNotification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark a notification as read
      operationId: markNotificationRead
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Marked read }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token (about 15 minutes), kept in memory by the client
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, expired or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated, but the role or membership does not allow this
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Unknown resource, or one the caller cannot access
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
    Role:
      type: string
      enum: [owner, admin, member]
    Label:
      type: string
      enum: [bug, feature, design, urgent, chore]
    User:
      type: object
      required: [id, name, email, avatarColor]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        avatarColor: { type: string }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 10 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    AuthResponse:
      type: object
      required: [user, accessToken]
      properties:
        user: { $ref: '#/components/schemas/User' }
        accessToken: { type: string }
    Workspace:
      type: object
      required: [id, name, role, memberCount]
      properties:
        id: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        memberCount: { type: integer }
    WorkspaceMember:
      type: object
      required: [userId, name, email, role, avatarColor]
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        avatarColor: { type: string }
    Board:
      type: object
      required: [id, workspaceId, name, description, updatedAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        name: { type: string }
        description: { type: string }
        updatedAt: { type: string, format: date-time }
    Column:
      type: object
      required: [id, boardId, name, order]
      properties:
        id: { type: string }
        boardId: { type: string }
        name: { type: string }
        order: { type: number }
    Comment:
      type: object
      required: [id, cardId, authorId, authorName, body, createdAt]
      properties:
        id: { type: string }
        cardId: { type: string }
        authorId: { type: string }
        authorName: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    Card:
      type: object
      required: [id, boardId, columnId, title, description, assigneeId, labels, dueDate, order, version, comments]
      properties:
        id: { type: string }
        boardId: { type: string }
        columnId: { type: string }
        title: { type: string }
        description: { type: string }
        assigneeId: { type: [string, 'null'] }
        labels:
          type: array
          items: { $ref: '#/components/schemas/Label' }
        dueDate: { type: [string, 'null'], format: date-time }
        order: { type: number }
        version:
          type: integer
          minimum: 1
          description: Starts at 1; incremented by every successful field update
        comments:
          type: array
          items: { $ref: '#/components/schemas/Comment' }
    UpdateCardRequest:
      type: object
      required: [version]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string }
        assigneeId: { type: [string, 'null'] }
        labels:
          type: array
          items: { $ref: '#/components/schemas/Label' }
        dueDate: { type: [string, 'null'], format: date-time }
        version:
          type: integer
          description: The version the client last saw
    BoardSnapshot:
      type: object
      required: [board, columns, cards]
      properties:
        board: { $ref: '#/components/schemas/Board' }
        columns:
          type: array
          items: { $ref: '#/components/schemas/Column' }
        cards:
          type: array
          items: { $ref: '#/components/schemas/Card' }
    AppNotification:
      type: object
      required: [id, kind, message, read, createdAt]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [assigned, commented, moved]
        message: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
